<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e"/>
      <stop offset="50%" stop-color="#0f2b3c"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Football Pitch Boundary -->
  <rect x="76" y="96" width="360" height="320" rx="18" fill="url(#pitchGrad)" stroke="#ffffff" stroke-width="6" opacity="0.95"/>

  <!-- Pitch Stripes Pattern -->
  <path d="M76 136 h360 M76 216 h360 M76 296 h360 M76 376 h360" stroke="#047857" stroke-width="26" opacity="0.35"/>

  <!-- Halfway Line and Center Circle -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#ffffff" stroke-width="5"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="#ffffff" stroke-width="5"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>

  <!-- Top Goal Box -->
  <rect x="176" y="96" width="160" height="64" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="216" y="96" width="80" height="24" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- Top Goal Arc -->
  <path d="M 220 160 A 36 36 0 0 0 292 160" fill="none" stroke="#ffffff" stroke-width="5"/>

  <!-- Bottom Goal Box -->
  <rect x="176" y="352" width="160" height="64" fill="none" stroke="#ffffff" stroke-width="5"/>
  <rect x="216" y="392" width="80" height="24" fill="none" stroke="#ffffff" stroke-width="5"/>
  <!-- Bottom Goal Arc -->
  <path d="M 220 352 A 36 36 0 0 1 292 352" fill="none" stroke="#ffffff" stroke-width="5"/>

  <!-- Corner Arcs -->
  <path d="M 76 116 A 20 20 0 0 0 96 96" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M 436 116 A 20 20 0 0 1 416 96" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M 76 396 A 20 20 0 0 1 96 416" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M 436 396 A 20 20 0 0 0 416 416" fill="none" stroke="#ffffff" stroke-width="5"/>

  <!-- Center Ball Icon -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="url(#glow)"/>
  <path d="M256 230 L276 244 L268 268 L244 268 L236 244 Z" fill="#0b132b"/>

  <!-- Brand Crown / Sports Badge Elements -->
  <circle cx="100" cy="80" r="14" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
  <circle cx="412" cy="80" r="14" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>
</svg>
